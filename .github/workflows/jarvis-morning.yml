name: Jarvis morning call

on:
  schedule:
    # Время в UTC: 05:45 UTC = 07:45 по Варшаве летом и 06:45 зимой. Поменяй под свой часовой пояс.
    # GitHub может запустить с опозданием на 5–15 минут.
    - cron: '45 5 * * 1-5'
  workflow_dispatch: {}   # кнопка «Run workflow», чтобы позвонить прямо сейчас

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node jarvis/call.mjs
        env:
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          VAPI_PHONE_NUMBER_ID: ${{ secrets.VAPI_PHONE_NUMBER_ID }}
          MY_PHONE: ${{ secrets.MY_PHONE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OWNER_NAME: ${{ vars.OWNER_NAME }}
          JARVIS_TZ: ${{ vars.JARVIS_TZ }}
          JARVIS_VOICE_ID: ${{ vars.JARVIS_VOICE_ID }}
          JARVIS_NOTES: ${{ vars.JARVIS_NOTES }}
