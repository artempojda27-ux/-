<title>Секретарь Лидов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: одна колонка «пульт секретаря» — сводка дня, список задач, трубка звонка снизу.
   Палитра взята из LEADS CONSOLE (текстолит + плазма), чтобы обе страницы выглядели одной системой. */
:root{
  --void:#03080F; --board:#061423; --board-2:#0A1E33; --trace:#123A60;
  --plasma:#22D3FF; --plasma-dim:rgba(34,211,255,.16);
  --alert:#FF2D4A; --ok:#3DDC97; --gold:#F5C451;
  --ink:#D6ECF8; --ink-dim:rgba(214,236,248,.62); --ink-faint:rgba(214,236,248,.38);
  --display:'Unbounded',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700}
h1{font-size:26px;letter-spacing:.01em}
h2{font-size:15px;font-weight:500;letter-spacing:.04em}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top .date{font-family:var(--mono);font-size:13px;color:var(--plasma)}
.panel{background:var(--board);border:1px solid var(--trace);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.meter{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--board-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--plasma);transition:width .4s}
.count{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-dim)}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--board-2);border:1px solid var(--trace);border-radius:10px;padding:10px 12px}
textarea{min-height:64px;resize:vertical}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--plasma);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;border:1px solid var(--trace);background:var(--board-2);color:var(--ink);padding:10px 14px}
button.primary{background:var(--plasma);border-color:var(--plasma);color:var(--void)}
button:disabled{opacity:.5;cursor:default}
ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--trace)}
.task:first-child{border-top:0}
.task input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--plasma)}
.task .txt{min-width:0}
.task.done .t{text-decoration:line-through;color:var(--ink-faint)}
.task .meta{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.06em}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--trace);color:var(--ink-dim);white-space:nowrap}
.chip.leads{color:var(--plasma);border-color:var(--plasma-dim)}
.chip.mail{color:var(--gold);border-color:rgba(245,196,81,.3)}
.chip.calls{color:var(--ok);border-color:rgba(61,220,151,.3)}
.del{background:none;border:0;color:var(--ink-faint);padding:0 4px;font-size:18px;line-height:1}
.empty{color:var(--ink-dim);font-size:14px}
.note{font-size:13px;color:var(--ink-dim)}
.err{color:var(--alert);font-size:13px}
.summary{white-space:pre-wrap;font-size:14px;color:var(--ink)}
.example{border:1px dashed var(--trace);border-radius:10px;padding:10px 12px}

/* Трубка */
.dock{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-top:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(to top,var(--void) 60%,transparent);display:flex;justify-content:center;z-index:5}
.callbtn{display:flex;align-items:center;gap:10px;border-radius:999px;padding:14px 26px;background:var(--ok);border-color:var(--ok);color:var(--void);font-size:16px;box-shadow:0 6px 24px rgba(61,220,151,.25)}
.callbtn svg{width:20px;height:20px}
.call{position:fixed;inset:0;z-index:20;background:var(--void);display:flex;flex-direction:column;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.call .head{max-width:640px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.call .who{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--board-2);border:1px solid var(--plasma);display:grid;place-items:center;font-family:var(--display);color:var(--plasma)}
.avatar.talking{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--plasma-dim)}}
@media (prefers-reduced-motion:reduce){.avatar.talking{animation:none}.bar i{transition:none}}
.timer{font-family:var(--mono);font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.log{flex:1;overflow-y:auto;max-width:640px;width:100%;margin:12px auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--board-2);border:1px solid var(--trace)}
.msg.sec{align-self:flex-start;background:var(--board);border:1px solid var(--plasma-dim)}
.msg.sys{align-self:center;font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.06em}
.composer{max-width:640px;width:100%;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:end}
.composer textarea{min-height:46px;max-height:140px}
.mic.on{background:var(--alert);border-color:var(--alert);color:var(--void)}
.hang{background:var(--alert);border-color:var(--alert);color:var(--void);border-radius:999px}
.hint{max-width:640px;width:100%;margin:6px auto 0;font-size:12px;color:var(--ink-faint)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="label">Секретарь · LEADS</div>
      <h1 id="greet">Доброе утро</h1>
    </div>
    <div class="date" id="today"></div>
  </header>

  <section class="panel" aria-labelledby="h-plan">
    <div class="top">
      <h2 id="h-plan">Задачи на сегодня</h2>
      <span class="count" id="count">0 / 0</span>
    </div>
    <div class="meter"><div class="bar"><i id="bar"></i></div></div>
    <ul class="tasks" id="tasks"></ul>
    <div class="row">
      <input type="text" id="newTask" placeholder="Добавить задачу вручную" aria-label="Новая задача">
      <button id="addBtn">Добавить</button>
    </div>
  </section>

  <section class="panel" aria-labelledby="h-brief">
    <h2 id="h-brief">Утренний бриф</h2>
    <label class="note" for="focus">Что сегодня важно? Ниша, город, сколько лидов в работе, сколько ответило. Можно пропустить.</label>
    <textarea id="focus" placeholder="например: кофейни Кракова, 12 ждут ответа, у сестры 3 звонка назначено"></textarea>
    <div class="row">
      <button class="primary" id="planBtn">Составить план дня</button>
      <button id="sumBtn">Итог дня</button>
    </div>
    <div class="err" id="planErr" hidden></div>
    <div class="summary" id="summary" hidden></div>
  </section>

  <p class="note" id="storeNote">Задачи сохраняются в вашем аккаунте и видны только вам.</p>
</div>

<div class="dock">
  <button class="callbtn" id="callBtn" aria-label="Позвонить секретарю">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
    Позвонить секретарю
  </button>
</div>

<div class="call" id="call" hidden role="dialog" aria-label="Звонок секретарю">
  <div class="head">
    <div class="who">
      <div class="avatar" id="avatar">С</div>
      <div><div style="font-weight:600">Секретарь</div><div class="timer" id="timer">00:00</div></div>
    </div>
    <div class="row">
      <button id="muteBtn" aria-pressed="false">Голос: вкл</button>
      <button class="hang" id="hangBtn">Положить трубку</button>
    </div>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="composer">
    <button class="mic" id="micBtn" aria-label="Говорить" hidden>🎙</button>
    <textarea id="say" placeholder="Скажите или напишите секретарю…" aria-label="Сообщение секретарю"></textarea>
    <button class="primary" id="sendBtn">Сказать</button>
  </div>
  <p class="hint" id="hint">Чтобы говорить голосом, нажмите на микрофон на клавиатуре телефона. Секретарь отвечает вслух.</p>
</div>

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now = new Date();
const TODAY = dayKey(now);
const YDAY = dayKey(new Date(now.getTime()-864e5));
$('today').textContent = now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
const h = now.getHours();
$('greet').textContent = h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';

const ROLE = `Ты личный секретарь владельца маленького агентства. Агентство находит местные бизнесы без сайта или со слабым сайтом и предлагает им сайт или продвижение.
Как идёт работа: владелец сканирует лидов в LEADS CONSOLE, проверяет их сайты, пишет холодные письма и ставит статус «написал». Сестра звонит тем, кто прочитал, и ставит статусы «ответил», «встреча» или «отказ».
Агенты в Claude Code: lead-scout (поиск лидов), site-auditor (аудит сайтов), copywriter (письма), call-script (скрипты звонков), console-dev (правки консоли).
Говори по-русски, коротко и по делу, тепло, без канцелярита. Не выдумывай цифры, которых тебе не дали.`;

/* ---------- хранилище ---------- */
let state = {tasks:[], focus:'', summary:''};
let dbRef = null, ydayRef = null, saving = Promise.resolve();
const LS = 'secretary:'+TODAY;
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

function save(){
  lsSet(LS,state);
  if(!dbRef) return;
  const snap = JSON.parse(JSON.stringify(state));
  saving = saving.then(()=>dbRef.set(snap)).catch(()=>{ $('storeNote').textContent='Не удалось сохранить в аккаунт. Задачи остались в этом браузере.'; });
}

async function initStore(){
  const local = lsGet(LS); if(local) { state = {...state, ...local}; render(); }
  if(!window.claude?.use){ $('storeNote').textContent='Задачи сохраняются только в этом браузере.'; return; }
  const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if(!db||!user){ $('storeNote').textContent='Войдите в аккаунт Claude, чтобы задачи сохранялись между устройствами. Сейчас они хранятся только в этом браузере.'; return; }
  const uid = await user.id();
  const col = db.collection('data/users/'+uid);
  dbRef = col.doc(TODAY); ydayRef = col.doc(YDAY);
  try{
    const s = await dbRef.get();
    if(s.exists){ state = {...state, ...s.data()}; render(); }
    else if(state.tasks.length){ save(); }
  }catch{}
}

/* ---------- задачи ---------- */
const TAGS = {leads:'лиды',mail:'письма',calls:'звонки',console:'консоль',other:'прочее'};
function addTask(text,tag='other',time=''){
  const t = {id:Math.random().toString(36).slice(2,9), text:String(text).slice(0,200), tag:TAGS[tag]?tag:'other', time:String(time||'').slice(0,20), done:false};
  state.tasks.push(t); save(); render(); return t;
}
function render(){
  const ul = $('tasks'); ul.textContent='';
  if(!state.tasks.length){
    const li = document.createElement('li'); li.className='empty example';
    li.innerHTML = 'Задач пока нет. Нажмите <b>«Составить план дня»</b>, и секретарь предложит 5–7 дел, например: <i>«Отсканировать 20 кофеен через lead-scout · лиды · 40 мин»</i>. Или позвоните ему.';
    ul.append(li);
  }
  for(const t of state.tasks){
    const li = document.createElement('li'); li.className='task'+(t.done?' done':'');
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=t.done; cb.id='t-'+t.id;
    cb.onchange=()=>{t.done=cb.checked; save(); render();};
    const box = document.createElement('label'); box.className='txt'; box.htmlFor=cb.id;
    const tx = document.createElement('div'); tx.className='t'; tx.textContent=t.text;
    const meta = document.createElement('div'); meta.className='meta';
    const chip = document.createElement('span'); chip.className='chip '+t.tag; chip.textContent=TAGS[t.tag]||'прочее';
    meta.append(chip); if(t.time){ meta.append(' · '+t.time); }
    box.append(tx,meta);
    const del = document.createElement('button'); del.className='del'; del.textContent='×'; del.setAttribute('aria-label','Удалить задачу');
    del.onclick=()=>{state.tasks=state.tasks.filter(x=>x!==t); save(); render();};
    li.append(cb,box,del); ul.append(li);
  }
  const done = state.tasks.filter(t=>t.done).length, all = state.tasks.length;
  $('count').textContent = `${done} / ${all}`;
  $('bar').style.width = all? (done/all*100)+'%' : '0';
  if(document.activeElement!==$('focus')) $('focus').value = state.focus||'';
  if(state.summary){ $('summary').hidden=false; $('summary').textContent=state.summary; }
}
$('addBtn').onclick=()=>{const v=$('newTask').value.trim(); if(v){addTask(v); $('newTask').value='';}};
$('newTask').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('addBtn').click();}};
$('focus').onchange=()=>{state.focus=$('focus').value; save();};

/* ---------- Claude ---------- */
let samplePromise = null;
const getSample = () => samplePromise ??= (window.claude?.use ? claude.use('sample') : Promise.resolve(null));
function errText(e){
  if(e?.code==='not_granted') return 'Нужно разрешить странице обращаться к Claude (меню Permissions у артефакта).';
  if(e?.code==='rate_limited') return 'Слишком много запросов. Подождите минуту.';
  if(e?.code==='cancelled') return '';
  return 'Секретарь не ответил. Попробуйте ещё раз.';
}

async function yesterdayLeftovers(){
  try{ if(ydayRef){ const s=await ydayRef.get(); if(s.exists) return (s.data().tasks||[]).filter(t=>!t.done).map(t=>t.text); } }catch{}
  const l = lsGet('secretary:'+YDAY); return l? l.tasks.filter(t=>!t.done).map(t=>t.text) : [];
}

$('planBtn').onclick = async ()=>{
  const btn=$('planBtn'); $('planErr').hidden=true;
  state.focus=$('focus').value; save();
  const sample = await getSample();
  if(!sample){ $('planErr').hidden=false; $('planErr').textContent='Секретарь работает только внутри Claude. Откройте страницу по ссылке в приложении Claude.'; return; }
  btn.disabled=true; btn.textContent='Секретарь думает…';
  try{
    const left = await yesterdayLeftovers();
    const plan = await sample.json(`${ROLE}

Составь план на сегодня (${$('today').textContent}).
Что важно сегодня, со слов владельца: ${state.focus||'не сказал'}
Недоделано вчера: ${left.length?left.join('; '):'ничего'}
Уже в списке на сегодня: ${state.tasks.map(t=>t.text).join('; ')||'пусто'}

Дай 5–7 конкретных задач, которых ещё нет в списке. Каждая должна быть с числом и действием: «Найти 20 лидов через lead-scout», а не «поработать с лидами». Первыми поставь вчерашние недоделки. Не забудь follow-up тем, кто молчит после письма, и сверку со звонками сестры.
Ответь только JSON-массивом объектов: {"text": "...", "tag": "leads|mail|calls|console|other", "time": "примерно сколько, например 30 мин"}`, {modelTier:'default', cache:false});
    if(Array.isArray(plan)) for(const p of plan.slice(0,8)) if(p?.text) addTask(p.text,p.tag,p.time);
  }catch(e){ const m=errText(e); if(m){$('planErr').hidden=false;$('planErr').textContent=m;} }
  finally{ btn.disabled=false; btn.textContent='Составить план дня'; }
};

$('sumBtn').onclick = async ()=>{
  const btn=$('sumBtn'); $('planErr').hidden=true;
  const sample = await getSample();
  if(!sample){ $('planErr').hidden=false; $('planErr').textContent='Секретарь работает только внутри Claude.'; return; }
  btn.disabled=true; $('summary').hidden=false; $('summary').textContent='…';
  try{
    const done=state.tasks.filter(t=>t.done).map(t=>t.text), open=state.tasks.filter(t=>!t.done).map(t=>t.text);
    const r = await sample(`${ROLE}\n\nПодведи итог дня в 4–6 строк: что сделано, что переносится на завтра и одна главная задача на утро.\nСделано: ${done.join('; ')||'ничего'}\nНе сделано: ${open.join('; ')||'ничего'}`,
      {modelTier:'quick', cache:false, onText:({text})=>{$('summary').textContent=text;}});
    state.summary=r.text; save();
  }catch(e){ $('summary').textContent=errText(e)||state.summary||''; }
  finally{ btn.disabled=false; }
};

/* ---------- звонок ---------- */
let history=[], ctl=null, voiceOn=true, t0=0, tick=null, rec=null;
const ru = () => (window.speechSynthesis?.getVoices()||[]).find(v=>/^ru/i.test(v.lang));
function speak(text){
  if(!voiceOn||!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/[*_#`]/g,'')); u.lang='ru-RU'; const v=ru(); if(v) u.voice=v; u.rate=1.05;
    u.onstart=()=>$('avatar').classList.add('talking'); u.onend=u.onerror=()=>$('avatar').classList.remove('talking');
    speechSynthesis.speak(u);
  }catch{}
}
function bubble(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;$('log').append(d);$('log').scrollTop=1e9;return d;}

const TOOLS = [
  {name:'list_tasks', description:'Возвращает задачи на сегодня: id, текст, тег, сделана ли.', execute:()=>state.tasks.map(({id,text,tag,done})=>({id,text,tag,done}))},
  {name:'add_task', description:'Добавляет задачу на сегодня. Возвращает созданную задачу.', inputSchema:{type:'object',properties:{text:{type:'string'},tag:{type:'string',enum:Object.keys(TAGS)},time:{type:'string'}},required:['text']},
    execute:i=>{const t=addTask(String(i.text||''),String(i.tag||'other'),String(i.time||''));return {id:t.id,text:t.text};}},
  {name:'set_done', description:'Отмечает задачу сделанной (done=true) или снимает отметку. Нужен id из list_tasks.', inputSchema:{type:'object',properties:{id:{type:'string'},done:{type:'boolean'}},required:['id']},
    execute:i=>{const t=state.tasks.find(x=>x.id===String(i.id)); if(!t) throw new Error('нет задачи с таким id'); t.done=i.done!==false; save(); render(); return {ok:true};}}
];

async function talk(text){
  const sample = await getSample();
  if(!sample){ bubble('sys','Секретарь отвечает только внутри Claude.'); return; }
  if(text) { history.push({role:'user',content:text}); bubble('me',text); }
  const el = bubble('sec','…'); $('sendBtn').disabled=true;
  ctl = new AbortController();
  const sys = `${ROLE}\nСейчас идёт телефонный звонок: отвечай 1–3 короткими фразами, как живой секретарь по телефону, без списков и разметки. Можешь смотреть, добавлять и отмечать задачи инструментами. Сегодня ${$('today').textContent}. Задачи: ${JSON.stringify(state.tasks.map(t=>({id:t.id,text:t.text,done:t.done})))}`;
  const msgs = [{role:'user',content:sys+'\n\n(Звонок начался. Поздоровайся и коротко скажи, что на сегодня главное.)'},{role:'assistant',content:'Алло!'}, ...history];
  if(msgs[msgs.length-1].role!=='user') msgs.push({role:'user',content:'(продолжай)'});
  try{
    const lim = await sample.limits().catch(()=>null);
    const r = await sample(msgs,{modelTier:'quick', cache:false, signal:ctl.signal, tools: lim?.tools? TOOLS: undefined, onText:({text})=>{el.textContent=text;}});
    const answer = r.text.split(/\n\s*\n/).pop().trim() || r.text;
    el.textContent = answer; history.push({role:'assistant',content:answer}); speak(answer);
  }catch(e){ el.textContent = e?.text || errText(e) || '…'; }
  finally{ $('sendBtn').disabled=false; ctl=null; }
}

$('callBtn').onclick=()=>{
  $('call').hidden=false; history=[]; $('log').textContent='';
  bubble('sys','Соединяю…');
  t0=Date.now(); clearInterval(tick); tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('timer').textContent=pad(Math.floor(s/60))+':'+pad(s%60);},1000);
  try{ speechSynthesis?.getVoices(); }catch{}
  talk('');
};
$('hangBtn').onclick=()=>{ ctl?.abort(); try{speechSynthesis.cancel();}catch{} try{rec?.stop();}catch{} clearInterval(tick); $('call').hidden=true; };
$('muteBtn').onclick=()=>{ voiceOn=!voiceOn; $('muteBtn').textContent='Голос: '+(voiceOn?'вкл':'выкл'); $('muteBtn').setAttribute('aria-pressed',String(!voiceOn)); if(!voiceOn) try{speechSynthesis.cancel();}catch{} };
$('sendBtn').onclick=()=>{ const v=$('say').value.trim(); if(!v) return; $('say').value=''; talk(v); };
$('say').onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); $('sendBtn').click(); } };

/* Распознавание речи в браузере: показываем кнопку, только если оно есть; если микрофон закрыт — прячем и остаёмся на диктовке с клавиатуры. */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  $('micBtn').hidden=false;
  $('micBtn').onclick=()=>{
    if(rec){ try{rec.stop();}catch{} return; }
    try{
      rec=new SR(); rec.lang='ru-RU'; rec.interimResults=true;
      rec.onresult=e=>{ $('say').value=[...e.results].map(r=>r[0].transcript).join(''); };
      rec.onerror=()=>{ $('micBtn').hidden=true; };
      rec.onend=()=>{ $('micBtn').classList.remove('on'); rec=null; if($('say').value.trim()) $('sendBtn').click(); };
      rec.start(); $('micBtn').classList.add('on');
    }catch{ rec=null; $('micBtn').hidden=true; }
  };
}

render(); initStore();
</script>
