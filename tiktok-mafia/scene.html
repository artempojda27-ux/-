      c.className = overVideo ? 'on over' : 'on';
      c.querySelector('.ct').textContent = e.title;
      c.querySelector('.cs').textContent = e.sub || '';
      c.querySelector('.roster').innerHTML = '';
      if (!overVideo) $('#bars').classList.add('on');
      setTimeout(() => c.classList.remove('on'), overVideo ? 3200 : 2600);
      setTimeout(() => $('#bars').classList.remove('on'), 3600);
      break;
    }

    case 'narrate': {
      const n = $('#narr');
      n.textContent = e.text;
      n.classList.add('on');
      $('#speech').classList.remove('on');
      speak(e.text, 'рассказчик', 'мужской', () => n.classList.remove('on'), e.audio);
      setTimeout(() => n.classList.remove('on'), 11000);
      break;
    }

    case 'party':
      if (e.lang) setLang(e.lang);
      $('#partyno').textContent = (LANG === 'ru' ? '№' : '#') + e.no;
      $('#phase').textContent = t('allIn');
      drawRoster(e.players);
      preloadActs(e.players);
      SND.phase('day');
      // первая картинка партии — солнечная площадь, а не пустой тёмный задник
      document.body.classList.remove('night', 'rain');
      setBackground('square', true);
      unfocus();
      break;

    case 'phase': {
      wideShot();
      const night = e.phase === 'night';
      SND.phase(night ? 'night' : 'day');
      document.body.classList.toggle('night', night);
      document.body.classList.toggle('rain', !!e.rain);
      $('#phase').textContent = `${night ? t('night') : t('day')} ${e.round}`;
      if (!night) {
        cutsceneOff();   // удержанный последний кадр (участок) уступает дню
        // день — площадь, люди снова в кадре
        setBackground('square', true);
        $('#cast').style.opacity = '1';
        $('#shades').classList.remove('on');
        $('#placeName').classList.remove('on');
      }
      if (night) {
        const c = $('#curtain');
        c.querySelector('.t').textContent = e.title || t('title');
        c.querySelector('.s').textContent = t('curtainSub');
        c.classList.add('on');
        speak(t('sayNight'), 'ведущий', 'мужской');
        setTimeout(() => c.classList.remove('on'), 2400);
      }
      stopTalking();
      unfocus();
      $('#speech').classList.remove('on');
      break;
    }

    case 'event': {
      SND.cue('event');
      const box = $('#event');
      box.querySelector('h2').textContent = e.title;
      box.querySelector('p').textContent = e.text;
      box.classList.add('on');
      speak(e.text, 'ведущий', 'мужской', null, e.audio);
      setTimeout(() => box.classList.remove('on'), 7000);
      break;
    }

    case 'line':
      $('#narr').classList.remove('on');
      if (e.slug) slugs[e.name] = e.slug;
      focusOn(e.name);
      {
        // настроение реплики: показывает на другого — обвиняет; его самого
        // недавно назвали — оправдывается; иначе просто говорит
        const target = e.suspect || Object.keys(cards).find(n => n !== e.name && e.text.includes(n));
        const underFire = accusedAt[e.name] && Date.now() - accusedAt[e.name] < 45000;
        const mood = target ? 'accuse' : underFire ? 'defend' : 'talk';
        if (target) accusedAt[target] = Date.now();
        if (mood === 'defend') delete accusedAt[e.name];
        closeUp(e.name, { talk: true, mood: hasAct(slugs[e.name], mood) ? mood : 'talk' });
      }
      $('#speaker').textContent = e.viewer ? `${e.name} → @${e.viewer}` : e.name;
      $('#line').innerHTML = esc(e.text).replace(/@([\w.]+)/g, '<span class="at">@$1</span>');
      $('#speech').classList.add('on');
      reactTo(e.text, e.name);
      startTalking(e.name);
      {
        // на кого показали: из движка, а в старых записях — первое имя в тексте
        const target = e.suspect || Object.keys(cards).find(n => n !== e.name && e.text.includes(n));
        speak(e.text.replace(/@/g, ''), e.name, e.voice, () => {
          stopTalking(e.name);
          shotVideo(e.name, 'idle');
          if (target) setTimeout(() => reactionShot(target), 250);
        }, e.audio);
      }
      break;

    case 'vote_open':
      $('#ladder').classList.add('hidden');
      $('#call').innerHTML = `${t('call')}<br>
        <span style="font-size:23px;opacity:.85">${t('callHint')}</span>`;
      $('#vote').classList.add('on');
      document.body.classList.add('voting');
      SND.cue('vote-start');
      $('#clock').textContent = e.seconds;
      unfocus();
      Object.values(cards).forEach(c => {
        c.querySelector('.bar').style.width = '0';
        c.querySelector('.pct').style.opacity = '0';
      });
      lastTally = {};
      startVoteCycle(e.candidates);
      break;

    case 'tick':
      hudState.phase = 'vote'; hudState.left = e.left; drawHud();
      SND.cue('vote-tick', e.left);
      $('#clock').textContent = e.left;
      break;

    case 'tally': {
      lastTally = e.tally || {};
      const total = Object.values(e.tally).reduce((s, n) => s + n, 0) || 1;
      for (const [name, n] of Object.entries(e.tally)) {
        const c = cards[name]; if (!c) continue;
        const pct = Math.round(n / total * 100);
        c.querySelector('.bar').style.width = pct + '%';
        const p = c.querySelector('.pct');
        p.textContent = pct + '%';
        p.style.opacity = n ? '1' : '0';
      }
      break;
    }

    case 'vote_paused':
      stopVoteCycle();
      $('#clock').textContent = '—';
      $('#call').innerHTML = `<b>${e.name}</b> — ${t('lastword')}`;
      break;

    case 'lastword':
      if (e.slug) slugs[e.name] = e.slug;
      focusOn(e.name);
      closeUp(e.name, { talk: true, mood: hasAct(slugs[e.name], 'defend') ? 'defend' : 'talk' });
      $('#speaker').textContent = `${e.name} · ${t('LASTWORD')}`;
      $('#line').textContent = e.text;
      $('#speech').classList.add('on');
      startTalking(e.name);
      speak(e.text, e.name, e.voice, () => stopTalking(e.name), e.audio);
      break;

    case 'vote_restart':
      startVoteCycle(voteNames);
      $('#call').innerHTML = `${t('revote')}<br>
        <span style="font-size:23px;opacity:.85">${t('revoteHint')}</span>`;
      $('#clock').textContent = e.seconds;
      unfocus();
      Object.values(cards).forEach(c => {
        c.querySelector('.bar').style.width = '0';
        c.querySelector('.pct').style.opacity = '0';
      });
      break;

    case 'vote_closed':
      stopVoteCycle();
      wideShot();
      document.body.classList.remove('voting');
      SND.cue('vote-end');
      $('#vote').classList.remove('on');
      $('#ladder').classList.remove('hidden');
      break;

    case 'montage': {
      wideShot();
      // Проход по городу. Персонажи уходят, остаётся место — но не пустое:
      // в нём шевелятся силуэты. Кто именно, зритель знать не должен.
      $('#curtain').classList.remove('on');
      $('#speech').classList.remove('on');
      $('#cast').style.opacity = '0';

      const label = $('#placeName'), shades = $('#shades');
      const list = e.places || [];
      const hold = e.hold || 2600;

      // перебивка — чистый кадр: интерфейс подарков уходит, как в кино
      $('#ladder').classList.add('hidden');
      document.body.classList.add('montage');
      list.forEach((p, i) => {
        setTimeout(() => {
          setBackground(p.id, e.day);
          label.querySelector('.pn').textContent = p.name;
          label.querySelector('.pc').textContent = e.clock || '';
          label.classList.add('on');
          drawShades(p.figures || 0);
        }, i * hold);
      });

      setTimeout(() => {
        label.classList.remove('on');
        shades.classList.remove('on');
        document.body.classList.remove('montage');
        $('#ladder').classList.remove('hidden');
      }, list.length * hold + 200);
      break;
    }

    case 'sheriff': {
      const c = $('#curtain');
      c.querySelector('.s').textContent = t('sheriff');
      break;
    }

    case 'nightplace': {
      wideShot();
      // место преступления во весь кадр: единственный раз, когда локация
      // не перебивка, а сцена
      if (e.whereId) {
        $('#cast').style.opacity = '0';
        setBackground(e.whereId, false);
        drawShades(1);
      }
      const p = $('#place');
      p.querySelector('.lbl').textContent = t('foundHere');
      p.querySelector('.loc').textContent = e.where;
      p.querySelector('.clock').textContent = e.clock || '';
      p.classList.add('on');
      if (e.text) {
        const n = $('#narr');
        n.textContent = e.text;
        n.classList.add('on');
        speak(e.text, 'рассказчик', 'мужской', () => n.classList.remove('on'), e.audio);
        setTimeout(() => n.classList.remove('on'), 11000);
      }
      setTimeout(() => p.classList.remove('on'), 8000);
      break;
    }

    case 'bought': {
      SND.cue('gift');
      const t = $('#toast');
      t.querySelector('.who2').textContent = '@' + e.user;
      t.querySelector('.what').textContent = `${e.label} → ${e.target}`;
      t.classList.add('on');
      clearTimeout(t._h);
      t._h = setTimeout(() => t.classList.remove('on'), 6000);
      break;
    }

    case 'inspect':
      showReveal(e.name, e.role, `${t('inspect')} · ${e.name}`, false);
      break;

    case 'evidence': {
      const box = $('#event');
      box.querySelector('h2').textContent = t('evidence');
      box.querySelector('p').textContent = e.text;
      box.classList.add('on');
      const fig = cards[e.name] && cards[e.name].querySelector('.figure');
      if (fig) { setFace(fig, e.name, '-angry'); setTimeout(() => setFace(fig, e.name, ''), 6000); }
      speak(e.text, 'ведущий', 'мужской', null, e.audio);
      setTimeout(() => box.classList.remove('on'), 7000);
      break;
    }

    case 'out': {
      const c = cards[e.name];
      if (c) {
        c.classList.add('out');
        c.querySelector('.plate').dataset.stamp = e.by === 'night' ? t('stampNight') : t('stampOut');
        if (e.by === 'night' && e.where) c.title = e.where;
      }
      if (e.by === 'vote') { SND.cue('vote-end'); showReveal(e.name, e.role); }
      break;
    }

    case 'over':
      $('#phase').textContent = e.winner === 'faithful' ? t('winCity') : t('winMafia');
      $('#speech').classList.remove('on');
      stopTalking();
      unfocus();
      for (const p of e.players) {
        const c = cards[p.name]; if (!c) continue;
        c.classList.remove('out');
        if (p.role === 'traitor') {
          c.querySelector('.plate').dataset.stamp = t('stampMafia');
          c.querySelector('.plate').style.boxShadow = 'inset 0 0 0 2px var(--blood)';
        }
      }
      break;

    case 'intermission': {
      $('#phase').textContent = t('next');
      // тизер остаётся, под ним — обратный отсчёт до следующей серии
      let left = e.seconds || 30;
      const sub = $('#hook .h-sub');
      clearInterval(interTimer);
      const draw = () => { sub.textContent = L(`СЛЕДУЮЩАЯ СЕРИЯ ЧЕРЕЗ 0:${String(Math.max(0, left)).padStart(2, '0')}`, 'NEXT EPISODE IN 0:{s}', { s: String(Math.max(0, left)).padStart(2, '0') }); };
      if (!$('#hook').classList.contains('on')) showHook({ kind: 'teaser', eye: L('ОСТАВАЙТЕСЬ', 'STAY TUNED'), text: L('Новая партия, новый состав. Мафия уже среди них.', 'New episode, new cast. The mafia is already among them.'), ms: 0 });
      draw();
      interTimer = setInterval(() => { left--; draw(); if (left <= 0) clearInterval(interTimer); }, 1000);
      break;
    }

    case 'error':
      $('#phase').textContent = t('crash');
      break;
  }
}

/* ─────────────────────── связь с сервером ───────────────────────
   Сервера нет (открыли файл напрямую или с телефона) — сцена крутит
   демо-партию сама, чтобы было видно оформление. */
let connected = false;
let demoStarted = false;

/* Запись реального прогона. Не сценарий: события сняты с работающего
   движка вместе с таймингами и проигрываются как были. */
if (window.REPLAY) {
  connected = true;
  const t0 = window.REPLAY[0].t;
  for (const item of window.REPLAY) {
    setTimeout(() => handle(item.e), item.t - t0);
  }
  const last = window.REPLAY[window.REPLAY.length - 1];
  setTimeout(() => location.reload(), last.t - t0 + 12000);
}

if (window.FORCE_DEMO) startDemo();

try {
  if (window.FORCE_DEMO || window.REPLAY) throw new Error('offline');
  const es = new EventSource('/stream');
  es.onopen = () => { connected = true; };
  es.onmessage = (m) => { connected = true; handle(JSON.parse(m.data)); };
  es.onerror = () => { if (!connected) startDemo(); };
} catch (_) {
  // запись играет сама: демо поверх неё смешивало две партии в одном кадре
  if (!window.REPLAY) startDemo();
}
setTimeout(() => { if (!connected) startDemo(); }, 2500);

function startDemo() {
  if (demoStarted) return;
  demoStarted = true;

  const cast = [
    ['Марго','margo','34, администратор салона'],
    ['Давид','david','41, руководитель отдела'],
    ['Лиза','liza','22, студентка'],
    ['Артур','artur','29, бармен'],
    ['Нина','nina','37, бухгалтер'],
    ['Костя','kostya','26, курьер'],
    ['Вика','vika','31, учительница'],
    ['Олег','oleg','45, прораб'],
  ];

  const script = [
    [0,    { type:'ladder', items: [
      { gift:'Rose', label:'голос с весом' },
      { gift:'Doughnut', label:'дать слово' },
      { gift:'Confetti', label:'подкинуть улику' },
      { gift:'Swan', label:'щит' },
      { gift:'Galaxy', label:'последнее слово' },
      { gift:'Airplane', label:'проверка' },
    ] }],
    [0,    { type:'party', no:'демо', players: cast.map(([name,slug,bio]) => ({name,slug,bio,voice:''})) }],

    // устанавливающая сцена: сначала город, потом уже люди
    [1200, { type:'montage', clock:'22:40', hold:2200, places:[
      { id:'bar', name:'бар «Полночь»' },
      { id:'depot', name:'склад у порта' },
      { id:'clinic', name:'ночная клиника' },
      { id:'home', name:'дома' },
    ] }],

    [10600,{ type:'phase', phase:'day', round:1 }],
    [11200,{ type:'line', name:'Давид', slug:'david', text:'Так, по порядку. Первое: кто вообще спал сегодня?' }],
    [14800,{ type:'line', name:'Марго', slug:'margo', text:'Давид, ты опять всех строишь. Мне это не нравится.' }],
    [18400,{ type:'line', name:'Лиза',  slug:'liza',  text:'Он первым заговорил. Всегда первым.' }],
    [21100,{ type:'event', title:'АНОНИМНАЯ ЗАПИСКА', text:'Под дверью нашли записку: «Ночью я видел, как Олег выходил из комнаты».' }],
    [24600,{ type:'line', name:'Олег',  slug:'oleg',  text:'Слушай сюда. Подкинуть бумажку каждый может.' }],
    [28100,{ type:'bought', user:'kirill_22', label:'подкинуть улику', target:'Олег' }],
    [29600,{ type:'evidence', name:'Олег', text:'Вчера он один знал, где спит Нина. Откуда?' }],
    [34600,{ type:'line', name:'Нина', slug:'nina', text:'Смотрите: вчера он защищал того, кого мы выгнали.' }],
    [38100,{ type:'vote_open', candidates: cast.map(c=>c[0]), seconds: 14 }],
  ];

  for (const [t, e] of script) setTimeout(() => handle(e), t);

  let left = 14;
  let phase = 'vote';
  const tally = { Олег: 0, Марго: 0, Давид: 0, Лиза: 0 };

  const iv = setInterval(() => {
    if (phase !== 'vote') return;

    handle({ type:'tick', left });
    tally.Олег += 3 + Math.random()*5;
    tally.Марго += Math.random()*3;
    tally.Давид += Math.random()*2;
    tally.Лиза += Math.random();
    handle({ type:'tally', tally: Object.fromEntries(
      Object.entries(tally).map(([k,v]) => [k, Math.round(v)])) });

    if (--left === 6) {   // посреди голосования покупают последнее слово
      phase = 'pause';
      handle({ type:'bought', user:'anna_m', label:'последнее слово', target:'Олег' });
      handle({ type:'vote_paused', name:'Олег' });
      setTimeout(() => handle({ type:'lastword', name:'Олег', slug:'oleg',
        text:'Я тут ни при чём. Вы гоните невиновного, а они смотрят и радуются.' }), 800);
      setTimeout(() => {
        for (const k in tally) tally[k] = 0;
        left = 10; phase = 'vote';
        handle({ type:'vote_restart', name:'Олег', seconds: left });
        handle({ type:'tally', tally });
      }, 9000);
      return;
    }

    if (left <= 0) {
      phase = 'done';
      handle({ type:'vote_closed' });
      handle({ type:'out', name:'Олег', role:'faithful', by:'vote' });
      setTimeout(() => handle({ type:'chapter', title:'НОЧЬ II', sub:'23:54' }), 5000);
      setTimeout(() => handle({ type:'phase', phase:'night', round:2 }), 7500);
      setTimeout(() => handle({ type:'narrate',
        text:'Город засыпает. Улицы пустеют, и каждый уходит туда, где его никто не ждёт.' }), 8200);
      setTimeout(() => handle({ type:'montage', clock:'23:54', places:[
        { id:'bar', name:'бар «Полночь»' },
        { id:'depot', name:'склад у порта' },
        { id:'terminal', name:'автовокзал' },
      ] }), 11000);
      setTimeout(() => handle({ type:'chapter', title:'УТРО', sub:'' }), 19000);
      setTimeout(() => handle({ type:'out', name:'Нина', role:'faithful', by:'night', where:'автовокзал' }), 21500);
      setTimeout(() => handle({ type:'narrate', text:'Утро. Нина не вернулась домой.' }), 22000);
      setTimeout(() => handle({ type:'nightplace', where:'автовокзал', whereId:'terminal',
        name:'Нина', clock:'23:54', text:'Всё случилось здесь — автовокзал. И кто-то об этом молчит.' }), 25000);
      setTimeout(() => { clearInterval(iv); demoStarted = false; startDemo(); }, 36000);
    }
  }, 1000);
}
</script>
